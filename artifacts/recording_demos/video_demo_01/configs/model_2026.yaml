  execution: NSE reported open to reported close on the decision session
  target: simple open-to-close return
  base_currency: INR
  interpretation: Static-weight retrospective forward extension through 2026-09-30.
    The verified 2025 model family, feature set, hyperparameters, preprocessing, and
    trading rule remain frozen. The estimator is fitted once using only pre-2026 observations
    and is not updated during the extension.
