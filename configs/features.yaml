feature_sets:
  F0:
    include_groups: [returns, momentum, trend, volatility, drawdown]
  F1:
    include_groups: [returns, momentum, trend, volatility, drawdown, intraday, volume, interactions]
  F2:
    include_groups: [returns, momentum, trend, volatility, drawdown, intraday, volume, interactions, cross_asset]

parameters:
  # Offset 0 is today's just-observed close-to-close log return.
  return_lag_offsets: [0, 1, 2, 4, 9]
  momentum_windows: [5, 10, 15, 20, 60, 120, 252]
  moving_average_windows: [10, 15, 20, 50, 200]
  volatility_windows: [10, 20, 60]
  drawdown_windows: [60, 252]
  volume_windows: [20, 60]
  cross_asset_windows: [5, 20, 60]
  correlation_window: 60
  minimum_fraction_observed: 1.0

output:
  default_feature_set: F2
  retain_base_columns: true

