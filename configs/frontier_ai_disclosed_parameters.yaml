schema_version: 1
measurement_policy:
  unit: billion_parameters
  missing_policy: retain_missing_and_add_disclosure_indicator
  flagship_policy: largest generally released model in the named release family
  moe_policy: record total and active parameters separately when officially disclosed
  exclusions: >-
    Rumoured parameter counts, third-party estimates, training-compute estimates,
    and incomparable benchmark scores are excluded. Parameter count is treated
    as a scale proxy, not as a complete measure of capability.
