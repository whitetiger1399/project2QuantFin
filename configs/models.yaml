research:
  feature_set: F2
  refit_frequency: month_start
  forecast_hurdle: 0.001
  one_way_cost_bps: 5.0
  annualization_sessions: 252
  primary_selection_metric: median_annual_net_sharpe
  tie_sharpe_tolerance: 0.05
  random_seed: 17
  # null means expanding; CLI --window overrides this value.
  training_window_observations: null

profiles:
  quick:
    families: [historical_mean, autoregression, ridge, elastic_net, hist_gradient_boosting]
    rff_components: [64, 256]
    rff_alphas: [0.1, 1.0]
  standard:
    families:
      - historical_mean
      - autoregression
      - ridge
      - lasso
      - elastic_net
      - pca_ridge
      - random_forest
      - extra_trees
      - hist_gradient_boosting
      - rff_ridge
    rff_components: [64, 256, 1024]
    rff_alphas: [0.01, 0.1, 1.0, 10.0]
  deep:
    families:
      - historical_mean
      - autoregression
      - ridge
      - lasso
      - elastic_net
      - pca_ridge
      - random_forest
      - extra_trees
      - hist_gradient_boosting
      - rff_ridge
    # 4096 transformed features crosses P/T for shorter/rolling samples.
    rff_components: [16, 64, 256, 1024, 4096]
    rff_alphas: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

grids:
  ridge:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  lasso:
    alpha: [0.00001, 0.00003, 0.0001, 0.0003, 0.001]
  elastic_net:
    alpha: [0.00003, 0.0001, 0.0003, 0.001]
    l1_ratio: [0.2, 0.5, 0.8]
  pca_ridge:
    n_components: [5, 10, 20, 40]
    alpha: [0.1, 1.0]
  random_forest:
    max_depth: [3, 6]
    min_samples_leaf: [50, 150]
    n_estimators: [300]
    max_features: [0.5]
  extra_trees:
    max_depth: [3, 6]
    min_samples_leaf: [50, 150]
    n_estimators: [300]
    max_features: [0.5]
  hist_gradient_boosting:
    max_leaf_nodes: [3, 7]
    l2_regularization: [1.0, 10.0]
    learning_rate: [0.05]
    max_iter: [150]
    min_samples_leaf: [100]
  rff_ridge:
    gamma_scale: [1.0]

compute:
  n_jobs: 2
  numerical_threads_per_worker: 1
  checkpoint_every_refit: true

selection:
  top_families: 2
  require_distinct_families: true
  minimum_prediction_coverage: 0.98

uncertainty:
  bootstrap_repetitions: 1000
  block_length_sessions: 20
  confidence_level: 0.95
  random_seed: 29

