project:
  name: project2_spy_timing
  base_currency: USD
  timezone: America/New_York
  random_seed: 17

market_data:
  primary_source: yahoo
  verification_source: stooq
  start: "2005-01-01"
  # yfinance treats end as exclusive. 2026-01-01 includes all of 2025.
  end_exclusive: "2026-01-01"
  traded_asset: SPY
  predictor_assets:
    - QQQ
    - IWM
    - TLT
    - GLD
  yahoo:
    auto_adjust: false
    actions: true
    repair: true
    interval: 1d
    timeout_seconds: 30
  stooq:
    symbols:
      # Stooq's documented ticker examples use lowercase exchange suffixes.
      SPY: spy.us

data_policy:
  decision_time: "18:00 America/New_York after session t"
  entry_time: "close of session t+1"
  label_end_time: "close of session t+2"
  label_formula: "adjusted_close[t+2] / adjusted_close[t+1] - 1"
  missing_traded_price: error
  missing_predictor_price: keep_null
  duplicate_policy: error_if_values_conflict
  adjusted_price_convention: yahoo_adjusted_close_total_return_proxy

splits:
  warmup:
    start: "2005-01-01"
    end: "2005-12-31"
  initial_train:
    start: "2006-01-01"
    end: "2014-12-31"
  screening:
    start: "2015-01-01"
    end: "2018-12-31"
  confirmation:
    start: "2019-01-01"
    end: "2021-12-31"
  final_test:
    start: "2022-01-01"
    end: "2025-12-31"

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts

