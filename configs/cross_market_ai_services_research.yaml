schema_version: 1
extends: configs/cross_market_research.yaml
study_id: nifty_it_ai_release_us_services_signed_intraday

tracking:
  dataset_prefix: ai_services_panel
  run_prefix: cm_ai_services
  freeze_prefix: cm_ai_services_freeze

study:
  interpretation: >-
    New, separately tracked historical experiment testing whether prior-session
    US IT-services returns and conservatively timed frontier-AI release events
    predict same-session Nifty IT constituent open-to-close returns. The cohort
    remains fixed at the constituents observed on 2026-10-30. Because 2025 was
    inspected in the earlier project, its results are historical replication,
    not a pristine untouched holdout.

raw_data:
  frontier_ai_events_root: data/raw/cross_market/frontier_ai_events
  required_groups: [india_core, us_limited_tech, us_it_services, us_it_enabled_payments, us_enterprise_software, us_context, indian_it_adrs, global_context, nifty50_point_in_time, sp500_point_in_time]
  optional_groups: [nifty500_point_in_time]

sample:
  end_exclusive: '2026-01-01'
  splits:
    initial_train: ['2016-07-21', '2020-12-31']
    screening: ['2021-01-01', '2022-12-31']
    confirmation: ['2023-01-01', '2024-12-31']
    final_test: ['2025-01-01', '2025-12-31']

feature_sets:
  F0_own: [asset, calendar, own]
  F1_nifty_it_peers: [asset, calendar, own, nifty_it_peers]
  F2_us_services: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, adr]
  F3_nifty50: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, adr, india_core, nifty50_aggregate]
  F4_sp500_aggregate: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, adr, india_core, nifty50_aggregate, sp500_aggregate]
  F5_sp500_constituents: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, adr, india_core, nifty50_aggregate, sp500_aggregate, sp500_raw]
  F6_ai_events: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, adr, india_core, nifty50_aggregate, sp500_aggregate, sp500_raw, ai_event, ai_interaction]
  F7_full_context: [asset, calendar, own, nifty_it_peers, us_it_services, us_it_services_aggregate, us_it_payments, us_it_payments_aggregate, us_enterprise_software, us_enterprise_software_aggregate, us_tech, adr, india_core, nifty50_aggregate, us_context, global, sp500_aggregate, sp500_raw, macro, scheduled, ai_event, ai_interaction, nonlinear]

models:
  model_family_feature_set: F7_full_context
  complexity_feature_set: F6_ai_events
  profiles:
    quick:
      feature_sets: [F0_own, F1_nifty_it_peers, F2_us_services, F3_nifty50, F4_sp500_aggregate, F5_sp500_constituents, F6_ai_events, F7_full_context]
      families: [zero, asset_mean, autoregression, ridge, elastic_net]
      grid_limit_per_family: 2
    standard:
      feature_sets: [F0_own, F1_nifty_it_peers, F2_us_services, F3_nifty50, F4_sp500_aggregate, F5_sp500_constituents, F6_ai_events, F7_full_context]
      families: [zero, asset_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, extra_trees, hist_gradient_boosting, rff_ridge]
      grid_limit_per_family: 2
    bounded:
      feature_sets: [F0_own, F1_nifty_it_peers, F2_us_services, F3_nifty50, F4_sp500_aggregate, F5_sp500_constituents, F6_ai_events, F7_full_context]
      families: [zero, asset_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, extra_trees, hist_gradient_boosting, rff_ridge]
      grid_limit_per_family: 1
      complexity_ratios: [0.5, 2.0, 10.0]
      complexity_penalties: [1.0]
      complexity_maximum_components: 1024
      family_parameter_overrides:
        lasso: {preselect_k: 300, max_iter: 2000, tolerance: 0.0005}
        elastic_net: {preselect_k: 300, max_iter: 2000, tolerance: 0.0005}
        extra_trees: {n_estimators: [150], max_depth: [6]}
        hist_gradient_boosting: {max_iter: [120], max_leaf_nodes: [15]}
    balanced:
      feature_sets: [F0_own, F1_nifty_it_peers, F2_us_services, F3_nifty50, F4_sp500_aggregate, F5_sp500_constituents, F6_ai_events, F7_full_context]
      families: [zero, asset_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, extra_trees, hist_gradient_boosting, rff_ridge]
      grid_limit_per_family: 1
      grid_limit_by_family: {lasso: 2, elastic_net: 2, pca_ridge: 2, extra_trees: 1, hist_gradient_boosting: 2}
      complexity_ratios: [0.5, 2.0, 5.0, 10.0]
      complexity_penalties: [0.1, 1.0, 10.0]
      complexity_maximum_components: 2048
      family_parameter_overrides:
        lasso: {preselect_k: 450, max_iter: 3000, tolerance: 0.0002}
        elastic_net: {preselect_k: 450, max_iter: 3000, tolerance: 0.0002}
        pca_ridge: {n_components: [25, 75], alpha: [0.1]}
        extra_trees: {n_estimators: [250], max_depth: [8], min_samples_leaf: [40], max_features: [0.5]}
        hist_gradient_boosting: {max_iter: [200], max_leaf_nodes: [15, 31], l2_regularization: [0.1]}
    deep:
      feature_sets: [F0_own, F1_nifty_it_peers, F2_us_services, F3_nifty50, F4_sp500_aggregate, F5_sp500_constituents, F6_ai_events, F7_full_context]
      families: [zero, asset_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, extra_trees, hist_gradient_boosting, rff_ridge]
      grid_limit_per_family: 2

strategy:
  state_columns: [us_it_services_aggregate__mean, ai_event__frontier_release_today]
  primary:
    name: signed_forecast
    top_k: 3
    short_k: 3
    forecast_hurdle: 0.0005
    maximum_weight: 0.3333333333
    maximum_gross_exposure: 1.0
    services_state_column: us_it_services_aggregate__mean
    services_down_threshold: 0.0
    event_state_column: ai_event__frontier_release_today
    event_short_override: true
    event_short_scope: all_cohort
    one_way_cost_bps: 5.0
    slippage_bps: 2.5
  robustness:
    top_k: [1, 3, 5]
    round_trip_cost_bps: [0, 15, 30, 50]
    forecast_hurdle: [0.0, 0.0005, 0.001]
    include_long_short: true

selection:
  confirmation_candidates: 13
  include_feature_progression_in_confirmation: true
  include_feature_progression_in_final_diagnostics: true

validation:
  refit_frequency_by_stage:
    screening: quarter_start
    confirmation: quarter_start
    final_test: quarter_start

compute_budget:
  target_total_wall_clock_hours: 3.0
  design_note: >-
    The balanced profile retains eight controlled ridge ladder models, multiple
    shrinkage/PCA/boosting settings, a 250-tree ensemble, and six capped RFF
    complexity/penalty settings. Quarterly refits and two shared-memory workers
    retain daily OOS forecasts while targeting a two-to-three-hour laptop run.

outputs:
  processed_root: data/processed/cross_market_ai_services
  analysis_root: artifacts/cross_market_ai_services/analysis
  runs_root: artifacts/cross_market_ai_services/runs
  freezes_root: artifacts/cross_market_ai_services/freezes
  documentation_root: documents/markdown
