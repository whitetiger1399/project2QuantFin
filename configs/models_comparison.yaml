research:
  feature_set: F2
  refit_frequency: month_start
  forecast_hurdle: 0.001
  one_way_cost_bps: 5.0
  annualization_sessions: 252
  primary_selection_metric: median_annual_net_sharpe
  tie_sharpe_tolerance: 0.05
  random_seed: 17
  training_window_observations: null

# Comparative research configuration. This is separate from the frozen
# submission configuration in configs/models.yaml.
profiles:
  quick:
    families: [historical_mean, autoregression, ridge, elastic_net, random_forest]
  standard:
    families: [historical_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, random_forest, extra_trees, hist_gradient_boosting, rff_ridge]
    rff_components: [16, 64, 256]
    rff_alphas: [0.1, 1.0]
  deep:
    families: [historical_mean, autoregression, ridge, lasso, elastic_net, pca_ridge, random_forest, extra_trees, hist_gradient_boosting, rff_ridge]
    rff_components: [16, 64, 256, 1024]
    rff_alphas: [0.1, 1.0, 10.0]

grids:
  ridge:
    alpha: [0.01, 0.1, 1.0]
  lasso:
    alpha: [0.0001, 0.001, 0.01]
  elastic_net:
    alpha: [0.0001, 0.001]
    l1_ratio: [0.2, 0.8]
  pca_ridge:
    n_components: [10, 25]
    alpha: [0.1, 1.0]
  random_forest:
    max_depth: [3]
    min_samples_leaf: [50]
    n_estimators: [300]
    max_features: [0.5]
  extra_trees:
    max_depth: [3, 6]
    min_samples_leaf: [25, 50]
    n_estimators: [300]
    max_features: [0.5]
  hist_gradient_boosting:
    max_leaf_nodes: [15, 31]
    l2_regularization: [0.1]
    learning_rate: [0.05, 0.1]
    max_iter: [100]
    min_samples_leaf: [50]
  rff_ridge:
    gamma_scale: [0.5, 1.0]

compute:
  n_jobs: 2
  numerical_threads_per_worker: 1
  checkpoint_every_refit: true

selection:
  top_families: 3
  require_distinct_families: true
  minimum_prediction_coverage: 0.98

uncertainty:
  bootstrap_repetitions: 1000
  block_length_sessions: 20
  confidence_level: 0.95
  random_seed: 29
