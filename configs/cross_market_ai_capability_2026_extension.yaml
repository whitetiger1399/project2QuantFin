schema_version: 1
extends: configs/cross_market_ai_capability_research.yaml
study_id: nifty_it_ai_capability_forward_extension_2026

tracking:
  dataset_prefix: ai_capability_2026_panel
  run_prefix: cm_ai_capability_2026

study:
  interpretation: >-
    Static-weight retrospective forward extension through 2026-09-30. The
    verified 2025 model family, feature set, hyperparameters, preprocessing,
    and trading rule remain frozen. The estimator is fitted once using only
    pre-2026 observations and is not updated during the extension.

capability_data:
  source_processed_root: data/processed/cross_market_ai_services_2026

sample:
  end_exclusive: '2026-10-01'
  splits:
    initial_train: ['2016-07-21', '2020-12-31']
    screening: ['2021-01-01', '2022-12-31']
    confirmation: ['2023-01-01', '2024-12-31']
    final_test: ['2026-01-01', '2026-09-30']

outputs:
  processed_root: data/processed/cross_market_ai_capability_2026
  analysis_root: artifacts/cross_market_ai_capability_2026/analysis
  runs_root: artifacts/cross_market_ai_capability_2026/runs
  freezes_root: artifacts/cross_market_ai_capability_2026/freezes
  documentation_root: documents/markdown
