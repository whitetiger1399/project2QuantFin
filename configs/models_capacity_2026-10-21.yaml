research:
  feature_set: F2
  refit_frequency: month_start
  forecast_hurdle: 0.001
  one_way_cost_bps: 5.0
  annualization_sessions: 252
  primary_selection_metric: median_annual_net_sharpe
  tie_sharpe_tolerance: 0.05
  random_seed: 17
  training_window_observations: 1260
profiles:
  quick:
    families: [historical_mean, autoregression, random_forest, hist_gradient_boosting]
  standard:
    families: [historical_mean, autoregression, random_forest, hist_gradient_boosting]
  deep:
    families: [historical_mean, autoregression, random_forest, hist_gradient_boosting]
grids:
  random_forest:
    max_depth: [3, 6, 10]
    min_samples_leaf: [20, 50]
    n_estimators: [300]
    max_features: [0.5]
  hist_gradient_boosting:
    max_leaf_nodes: [15, 31]
    l2_regularization: [0.1, 1.0]
    learning_rate: [0.03, 0.10]
    max_iter: [50, 100, 200, 400]
    min_samples_leaf: [20]
compute:
  n_jobs: 2
  numerical_threads_per_worker: 1
  checkpoint_every_refit: true
selection:
  top_families: 2
  require_distinct_families: true
  minimum_prediction_coverage: 0.98
uncertainty:
  bootstrap_repetitions: 2000
  block_length_sessions: 20
  confidence_level: 0.95
  random_seed: 29

