[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project2-quantfin"
version = "0.1.0"
description = "Reproducible market-data and walk-forward research pipeline for Quantitative Finance Project 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "PyYAML>=6.0,<7",
  "yfinance>=0.2.54,<1",
  "pandas-datareader>=0.10,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[project.scripts]
quantfin = "quantfin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

